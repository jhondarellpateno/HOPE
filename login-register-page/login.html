<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <link rel="stylesheet" href="../design/login-page.css" />
  </head>
  <body>
    <nav class="navbar">
      <div class="nav-container">
        <img src="../images/hope-logo.png" alt="Logo" class="logo" />
        <ul>
          <li><a href="../landing-page/index.html">Home</a></li>
        </ul>
      </div>
    </nav>

    <div class="login-container">
      <h1>Welcome back</h1>
      <p class="login-intro">Log in to continue to your H.O.P.E. account.</p>
      <form action="../login-register-page/login.html" method="post">
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" required />
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" required />
        </div>
        <button type="submit">Login</button>
      </form>
      <p class="register-link">
        Don't have an account? <a href="../login-register-page/register.html">Register here</a>.
      </p>
  </body>
</html>
