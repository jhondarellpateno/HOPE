<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register</title>
    <link rel="stylesheet" href="../design/register-page.css" />
  </head>
  <body>
    <nav class="navbar">
      <div class="nav-container">
        <img src="../images/hope-logo.png" alt="Logo" class="logo" />
        <ul>
          <li><a href="../landing-page/index.html">Home</a></li>
        </ul>
      </div>
    </nav>

    <div class="register-container">
      <h1>Register</h1>
        <p class="register-intro">Create an account to access H.O.P.E. services.</p>
        <form action="../login-register-page/register.html" method="post">
          <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" required />
          </div>
          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required />
          </div>
          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required />
          </div>
            <div class="form-group">
                <label for="confirm-password">Confirm Password</label>
                <input type="password" id="confirm-password" name="confirm-password" required />
            </div>
            <div class="form-group">
               <label for="birthday">Birthday</label>
               <input type="date" id="birthday" name="birthday" required />
            </div>
                <label for="gender">Gender</label>
                <select id="gender" name="gender" required>
                    <option value="">Select Gender</option>
                    <option value="male">Male</option>
                    <option value="female">Female</option>
                    <option value="other">Other</option>
                </select>
            <button type="submit">Register</button>
        </form>
        <p class="login-link">
            Don't have an account? <a href="../login-register-page/login.html">Login Here</a>.
        </p>
  </body>
</html>
